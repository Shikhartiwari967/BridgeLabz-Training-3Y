<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Form Security Attributes</title>
</head>

<body>

    <h1>Secure Registration Form</h1>

    <form autocomplete="off">

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <input type="submit" value="Submit">

    </form>

    <p>
        Note: Turning off autocomplete can improve security by preventing the
        browser from automatically storing or suggesting sensitive information,
        especially on shared or public computers.
    </p>

</body>
</html>

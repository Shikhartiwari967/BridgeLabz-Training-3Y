<!DOCTYPE html>
<html lang="en">

<head>

    <!-- <title> defines the title shown in the browser tab -->
    <title>Important Head Elements</title>

    <!-- <meta charset> specifies the character encoding -->
    <meta charset="UTF-8">

    <!-- <meta name="description"> provides a description of the webpage -->
    <meta name="description" content="A webpage demonstrating important HTML head elements.">

    <!-- <meta name="author"> specifies the author of the webpage -->
    <meta name="author" content="Raghav Singh">

    <!-- <base> sets the base URL for relative links in the webpage -->
    <base href="https://example.com/">

    <!-- <link> connects an external resource, such as a favicon, to the webpage -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- <style> contains CSS rules for styling the webpage -->
    <style>
        /* CSS can be written here */
    </style>

    <!-- <script> contains JavaScript code for webpage functionality -->
    <script>
        // JavaScript can be written here
    </script>

</head>

<body>

    <h1>Important HTML Head Elements</h1>

    <p>
        This page demonstrates the important elements commonly used inside
        the HTML head section.
    </p>

</body>

</html>

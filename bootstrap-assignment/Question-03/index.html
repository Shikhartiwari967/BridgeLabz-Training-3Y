<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS for the hover effects and transitions -->
    <style>
        /* Adds a smooth transition to the card */
        .product-card {
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        
        /* Elevates the card and increases shadow on hover */
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important; /* Bootstrap's shadow-lg equivalent */
        }
    </style>
</head>
<body class="bg-light">

    <!-- Header -->
    <header class="bg-white shadow-sm py-3 mb-5">
        <div class="container">
            <h1 class="h4 mb-0 fw-bold">TechStore Catalog</h1>
        </div>
    </header>

    <main class="container">
        <!-- row: Creates the flex container for the grid -->
        <!-- g-4: Adds consistent gaps (gutters) between the columns -->
        <div class="row g-4 mb-5">
            
            <!-- Product 1 -->
            <!-- col-12: Takes full width (1 column) on mobile -->
            <!-- col-sm-6: Takes half width (2 columns) on tablets -->
            <!-- col-md-3: Takes 1/4th width (4 columns) on desktop -->
            <div class="col-12 col-sm-6 col-md-3">
                <!-- card: Base container for a Bootstrap card -->
                <!-- shadow-sm: Adds the initial small shadow required by the prompt -->
                <!-- h-100: Ensures all cards in the row stretch to the same height -->
                <div class="card h-100 shadow-sm product-card">
                    <!-- card-img-top: Styles the image to sit flush at the top of the card -->
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80" class="card-img-top" alt="Wireless Headphones">
                    <div class="card-body d-flex flex-column text-center">
                        <h5 class="card-title fw-bold">Wireless Headphones</h5>
                        <p class="card-text text-muted mb-4">$99.99</p>
                        <!-- mt-auto: Pushes the button to the bottom of the card -->
                        <!-- btn-outline-primary: Styled button with border color -->
                        <a href="#" class="btn btn-outline-primary mt-auto">Add to Cart</a>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm product-card">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&q=80" class="card-img-top" alt="Smart Watch">
                    <div class="card-body d-flex flex-column text-center">
                        <h5 class="card-title fw-bold">Smart Watch V2</h5>
                        <p class="card-text text-muted mb-4">$199.99</p>
                        <a href="#" class="btn btn-outline-primary mt-auto">Add to Cart</a>
                    </div>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm product-card">
                    <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad?auto=format&fit=crop&w=400&q=80" class="card-img-top" alt="Mechanical Keyboard">
                    <div class="card-body d-flex flex-column text-center">
                        <h5 class="card-title fw-bold">Mechanical Keyboard</h5>
                        <p class="card-text text-muted mb-4">$129.99</p>
                        <a href="#" class="btn btn-outline-primary mt-auto">Add to Cart</a>
                    </div>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm product-card">
                    <img src="https://images.unsplash.com/photo-1606220838315-056192d5e927?auto=format&fit=crop&w=400&q=80" class="card-img-top" alt="Gaming Mouse">
                    <div class="card-body d-flex flex-column text-center">
                        <h5 class="card-title fw-bold">Gaming Mouse</h5>
                        <p class="card-text text-muted mb-4">$59.99</p>
                        <a href="#" class="btn btn-outline-primary mt-auto">Add to Cart</a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <div class="container">
            <p class="mb-0">&copy; 2026 TechStore. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

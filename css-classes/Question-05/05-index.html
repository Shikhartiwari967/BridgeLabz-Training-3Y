<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="05-style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Styled Button Collection</h1>
        <p>Different button styles using HTML and CSS</p>
    </header>

    <!-- Main Content -->
    <main>
        <section class="button-section">

            <h2>Button Styles</h2>

            <div class="button-container">

                <!-- Primary Button -->
                <button class="btn primary">
                    Primary Button
                </button>

                <!-- Secondary Button -->
                <button class="btn secondary">
                    Secondary Button
                </button>

                <!-- Outline Button -->
                <button class="btn outline">
                    Outline Button
                </button>

                <!-- Disabled Button -->
                <button class="btn disabled" disabled>
                    Disabled Button
                </button>

            </div>

            <!-- Information -->
            <div class="info">
                <p>
                    <strong>Hover:</strong> Move the mouse over a button.
                </p>

                <p>
                    <strong>Active:</strong> Press and hold a button.
                </p>

                <p>
                    <strong>Focus:</strong> Use the Tab key to focus a button.
                </p>

                <p>
                    <strong>Disabled:</strong> This button cannot be clicked.
                </p>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Styled Button Collection</p>
    </footer>

</body>
</html>

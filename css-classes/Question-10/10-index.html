<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="10-style.css">
</head>

<body>

   
    <header class="header">
        <div class="header-content">
            <h1>Mini UI</h1>

            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>


   
    <main class="main-container">

        <section class="main-card">

            <!-- Small Image -->
            <div class="image-section">
                <img
                    src="https://via.placeholder.com/180"
                    alt="User interface illustration"
                >
            </div>

            <!-- Form Section -->
            <div class="form-section">

                <h2>Contact Us</h2>

                <p class="description">
                    Fill out the form below to get in touch with us.
                </p>

                <form>

                    <!-- Name -->
                    <div class="form-group">
                        <label for="name">Name</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required
                        >
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <!-- Message -->
                    <div class="form-group">
                        <label for="message">Message</label>

                        <textarea
                            id="message"
                            name="message"
                            rows="4"
                            placeholder="Write your message..."
                        ></textarea>
                    </div>

                    <!-- Buttons -->
                    <div class="button-group">
                        <button type="submit" class="btn submit-btn">
                            Submit
                        </button>

                        <button type="reset" class="btn reset-btn">
                            Reset
                        </button>
                    </div>

                </form>

            </div>

        </section>

    </main>


    
    <footer class="footer">
        <p>&copy; 2026 Mini User Interface. All rights reserved.</p>
    </footer>

</body>
</html>

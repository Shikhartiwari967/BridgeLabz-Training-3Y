<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="q04-style.css">
</head>
<body>

    <div class="dashboard">

        <!-- Header spans all columns -->
        <header>
            <h1>Admin Dashboard</h1>
        </header>

        <!-- Sidebar -->
        <aside>
            <h2>Menu</h2>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Users</a>
                <a href="#">Products</a>
                <a href="#">Orders</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="content">

            <div class="dashboard-box box1">
                <h2>Total Users</h2>
                <p>1,250</p>
            </div>

            <div class="dashboard-box box2">
                <h2>Total Orders</h2>
                <p>850</p>
            </div>

            <!-- This box spans two columns -->
            <div class="dashboard-box box3">
                <h2>Sales Overview</h2>
                <p>Monthly sales information</p>
            </div>

            <div class="dashboard-box box4">
                <h2>Pending Tasks</h2>
                <p>25 tasks remaining</p>
            </div>

        </main>

    </div>

</body>
</html>

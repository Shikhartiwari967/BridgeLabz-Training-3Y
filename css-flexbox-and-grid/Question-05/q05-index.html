<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="q05-style.css">
</head>
<body>

    <main class="pricing-section">

        <h1>Choose Your Plan</h1>

        <div class="pricing-container">

            <!-- Basic Plan -->
            <section class="pricing-card">
                <h2>Basic</h2>

                <p class="price">₹499</p>

                <ul>
                    <li>5 Projects</li>
                    <li>10 GB Storage</li>
                    <li>Email Support</li>
                </ul>

                <a href="#">Choose Plan</a>
            </section>

            <!-- Standard Plan -->
            <section class="pricing-card popular">
                <span class="badge">Most Popular</span>

                <h2>Standard</h2>

                <p class="price">₹999</p>

                <ul>
                    <li>15 Projects</li>
                    <li>50 GB Storage</li>
                    <li>Priority Support</li>
                </ul>

                <a href="#">Choose Plan</a>
            </section>

            <!-- Premium Plan -->
            <section class="pricing-card">
                <h2>Premium</h2>

                <p class="price">₹1,499</p>

                <ul>
                    <li>Unlimited Projects</li>
                    <li>100 GB Storage</li>
                    <li>24/7 Support</li>
                </ul>

                <a href="#">Choose Plan</a>
            </section>

        </div>

    </main>

</body>
</html>

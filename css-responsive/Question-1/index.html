<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1: Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Responsive Image Filter Gallery</h1>
    </header>
    <main>
        <section class="gallery">
            <figure class="gallery-item blur">
                <img src="https://picsum.photos/400/300?random=1" alt="Random Image 1">
                <figcaption>Blur</figcaption>
            </figure>
            <figure class="gallery-item grayscale">
                <img src="https://picsum.photos/400/300?random=2" alt="Random Image 2">
                <figcaption>Grayscale</figcaption>
            </figure>
            <figure class="gallery-item sepia">
                <img src="https://picsum.photos/400/300?random=3" alt="Random Image 3">
                <figcaption>Sepia</figcaption>
            </figure>
            <figure class="gallery-item brightness">
                <img src="https://picsum.photos/400/300?random=4" alt="Random Image 4">
                <figcaption>Brightness</figcaption>
            </figure>
            <figure class="gallery-item contrast">
                <img src="https://picsum.photos/400/300?random=5" alt="Random Image 5">
                <figcaption>Contrast</figcaption>
            </figure>
            <figure class="gallery-item hue-rotate">
                <img src="https://picsum.photos/400/300?random=6" alt="Random Image 6">
                <figcaption>Hue-Rotate</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
